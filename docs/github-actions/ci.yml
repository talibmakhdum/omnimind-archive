name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app --ignore-missing-imports
      - name: Pytest + coverage
        env:
          ALLOW_INMEMORY_VECTORS: "true"
          QUEUE_BACKEND: memory
          API_KEY: test-key
          AUTH_REQUIRED: "true"
          BCRYPT_ROUNDS: "4"
          PURGE_ENABLED: "true"
        run: PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Alembic upgrade
        env:
          DATA_DIR: /tmp/omnimind-ci-data
        run: PYTHONPATH=. alembic upgrade head
      - name: pip-audit
        run: pip-audit -r requirements.txt || true

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          for f in README.md CONTRIBUTING.md docs/arch.md docs/ops.md docs/migrations.md docs/monitoring.md docs/api.md docs/sdk.md docs/troubleshooting.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t omnimind-api:ci .
