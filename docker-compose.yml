services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - LOCAL_ONLY=true
      - EMBEDDING_PROVIDER=local
    volumes:
      - ./.data:/app/.data
      - ./.chroma:/app/.chroma
      - ./.cache:/app/.cache

  streamlit:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - API_BASE_URL=http://fastapi:8000
    depends_on:
      - fastapi
